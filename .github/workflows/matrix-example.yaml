name: Matrix example
on: push
jobs:
  build:
    strategy:
      matrix:
        node-version: [12,14] #Allows you to run steps on different versions
        operating-system: [ubuntu-slim, windows-latest] #Allows you to run steps on OS
        include: #Allows you to add other version or OS
          - node-version: 16
        exclude: #Allows you to remove other versions or OS
          - operating-system: ubuntu-slim
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v6
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
            node-version: 18
      - name: install dependencies
        run: npm install
      - name: build the project
        run: npm run build
          
