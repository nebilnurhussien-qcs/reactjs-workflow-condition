name: reuse workflow example
on: 
  workflow_call: #This is used when you want workflow to trigger when making call from seperate workflow
    inputs: #Allows you to add inputs when you call from workflow
      artifact-name: 
        description: name of the artifact
        required: false
        default: dist
        type: string
    #secrets:  #Allows you to add secrets
      #password:
        #required: true
    outputs:
      result: 
        description: your result name
        value: ${{ jobs.deploy.outputs.outcome }}
jobs:
  deploy:
    outputs:
      outcome: ${{ steps.step-result.outputs.step-result }}
    runs-on: ubuntu-slim
    env:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - name: get artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact-name }}
      - name: output data
        run:  |
          echo "Artifact file name: ${{ env.artifact-name }}"
      - name: list artifact name
        run: ls
      - name: set the outputs
        id: step-result
        run: echo "step-result=success" >> $GITHUB_OUTPUT

  print-output:
    needs: deploy
    runs-on: ubuntu-slim
    steps:
      - name: getting output
        run: echo ${{ needs.deploy.outputs.result }}
        

      
